# Single origin for the demo UI.
#
# The page, the REST snapshot, the bet endpoint and the WebSocket stream all appear
# under http://localhost:8080, so the browser makes no cross-origin request and
# neither Spring service needs CORS configuration.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve upstream names at request time through Docker's embedded DNS.
    #
    # A literal hostname in proxy_pass is resolved ONCE, when nginx starts. Recreating a
    # service container (docker compose up --build) gives it a new IP, and nginx would keep
    # sending traffic to the dead address until restarted. Putting the host in a variable
    # forces a lookup per request (cached for `valid`). A variable proxy_pass with no URI part
    # still forwards the original request URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Exact match: only POST /api/v1/bets belongs to bet-service.
    location = /api/v1/bets {
        set $bet_service bet-service;
        proxy_pass http://$bet_service:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Snapshot read path.
    location /api/v1/events/ {
        set $odds_service odds-service;
        proxy_pass http://$odds_service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket stream. Needs HTTP/1.1 plus the Upgrade/Connection headers, and a
    # long read timeout so an idle socket is not culled after the default 60s.
    location /api/v1/stream {
        set $realtime_gateway realtime-gateway;
        proxy_pass http://$realtime_gateway:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Demo control API on the provider simulator: create/settle matches on demand.
    location /dev/ {
        set $provider_simulator provider-simulator;
        proxy_pass http://$provider_simulator:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
