# Full local stack: infrastructure plus all six services.
#
# Build the JARs first, then bring everything up:
#   ./mvnw clean package
#   docker compose up -d --build
#
# Infrastructure only (to run services from your IDE or ./mvnw instead):
#   docker compose up -d kafka kafka-init redis postgres

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &service-env
    # Containers reach Kafka on the internal DOCKER listener; the host uses localhost:9092.
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    REDIS_HOST: redis
    REDIS_PORT: 6379
    DB_URL: jdbc:postgresql://postgres:5432/sportsbook
    DB_USERNAME: sportsbook
    DB_PASSWORD: sportsbook
    SPORTS_EVENTS_TOPIC: sports-events
    BET_EVENTS_TOPIC: bet-events

services:

  # ---------------------------------------------------------------- infrastructure

  kafka:
    image: apache/kafka:4.0.0
    container_name: sportsbook-kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft: single node as both broker and controller (no ZooKeeper) ---
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners are required: a broker can advertise only one address per
      # listener, and `localhost:9092` is unreachable from another container while
      # `kafka:19092` is unreachable from the host.
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # --- single-node sizing ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot: create both topics with 3 partitions so partition-key ordering is
  # observable. Auto-creation would yield a single partition.
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: sportsbook-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    # Literal block (|), not folded (>): folded scalars preserve newlines on
    # more-indented lines, which silently splits a shell command chain.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        TOPICS=/opt/kafka/bin/kafka-topics.sh
        $$TOPICS --bootstrap-server kafka:19092 --create --if-not-exists --topic sports-events --partitions 3 --replication-factor 1
        $$TOPICS --bootstrap-server kafka:19092 --create --if-not-exists --topic bet-events --partitions 3 --replication-factor 1
        echo "--- topics ---"
        $$TOPICS --bootstrap-server kafka:19092 --list

  redis:
    image: redis:7-alpine
    container_name: sportsbook-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: sportsbook-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sportsbook
      POSTGRES_USER: sportsbook
      POSTGRES_PASSWORD: sportsbook
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbook -d sportsbook"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- services

  # Owns ALL Flyway migrations for the sportsbook database, so it must reach a
  # healthy state before settlement-service starts.
  bet-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: bet-service
    container_name: sportsbook-bet-service
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  state-processor:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: state-processor
    container_name: sportsbook-state-processor
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  odds-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: odds-service
    container_name: sportsbook-odds-service
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Runs with Flyway disabled: bet-service owns the schema. Waits for it so the
  # tables exist before Hibernate validates them.
  settlement-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: settlement-service
    container_name: sportsbook-settlement-service
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bet-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Pure Vert.x: no Actuator, so no healthcheck. Streams live only, which is why
  # the feed worker waits for it.
  realtime-gateway:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: realtime-gateway
    container_name: sportsbook-realtime-gateway
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
    depends_on:
      kafka:
        condition: service_healthy

  # Started last so the consumers are already listening. state-processor and
  # settlement-service read from `earliest` and would catch up regardless, but the
  # gateway only forwards live traffic.
  odds-feed-worker:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: odds-feed-worker
    container_name: sportsbook-odds-feed-worker
    ports:
      # Dev control API used by the demo panel.
      - "8086:8086"
    environment:
      <<: *service-env
      PROVIDER_INTERVAL_MS: "2000"
      DEMO_EVENT_ID: event-123
      DEMO_MARKET_ID: market-456
      DEV_CONTROL_PORT: "8086"
      # Scripted loop stays on; the dev panel creates independent matches alongside it.
      # Set to "false" to drive everything by hand with no background traffic.
      FEED_AUTOPLAY: "true"
    depends_on:
      kafka:
        condition: service_healthy
      state-processor:
        condition: service_healthy
      settlement-service:
        condition: service_healthy
      realtime-gateway:
        condition: service_started

  # Static demo client behind a reverse proxy, so the page, the REST snapshot, the bet
  # endpoint and the WebSocket all share one origin and no CORS config is needed.
  ui:
    image: nginx:1.27-alpine
    container_name: sportsbook-ui
    ports:
      - "8080:80"
    volumes:
      - ./ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      # nginx resolves its upstream names at startup, so the containers must exist first.
      odds-service:
        condition: service_healthy
      bet-service:
        condition: service_healthy
      realtime-gateway:
        condition: service_started
      odds-feed-worker:
        condition: service_started

volumes:
  postgres-data:
